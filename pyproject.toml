[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "washstand-vla"
version = "0.1.0"
description = "Local tooling for the pi05 SO101 washstand project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
washstand = "washstand_vla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
